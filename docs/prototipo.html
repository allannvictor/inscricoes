<title>Protótipo Inscrições do Clube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra do protótipo fixa no topo; atleta em coluna de celular, organizador em painel largo */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #1b1f24;
  --muted: #5f6670;
  --line: #e2e5e9;
  --action: #2563eb;
  --action-ink: #ffffff;
  --bib: #f5f6f8;
  --bib-ink: #1b1f24;
  --ok: #157a46;
  --ok-bg: #e3f4ea;
  --warn: #9a5b00;
  --warn-bg: #fff1d6;
  --bad: #b42318;
  --bad-bg: #fde8e6;
  --note-bg: #eaf0ff;
  --note-line: #b9c9f6;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 12px;
}
/* Sempre claro (fundo branco), independente do tema do aparelho */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #24292f; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2rem; font-weight: 800; text-transform: uppercase; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); }

/* Barra do protótipo */
.proto {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); color: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
}
:root .proto { color: #f0f2f4; background: #24292f; }
.proto .tag { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.proto .tag b { background: #f0f2f4; color: #24292f; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
.seg { display: inline-flex; border: 1px solid #4a525b; border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: #c8cdd3; padding: 5px 12px; cursor: pointer; font-size: .85rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: #f0f2f4; color: #24292f; }
.proto select { background: #32383f; color: #f0f2f4; border: 1px solid #4a525b; border-radius: 8px; padding: 5px 8px; font-size: .85rem; max-width: 100%; }
.proto .spacer { flex: 1; }
.proto .reset { background: transparent; border: 1px solid #4a525b; color: #c8cdd3; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: .82rem; }

/* Containers */
.phone { max-width: 440px; margin: 20px auto 0; display: flex; flex-direction: column; gap: 14px; }
.wide { max-width: 1040px; margin: 20px auto 0; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

/* Nota de discussão */
.note { background: var(--note-bg); border: 1px dashed var(--note-line); border-radius: 10px; padding: 10px 12px; font-size: .86rem; }
.note summary { cursor: pointer; font-weight: 600; }
.note ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 12px 16px; font-weight: 700; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
.btn-primary { background: var(--action); color: var(--action-ink); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 10px; font-size: .85rem; border-radius: 8px; font-weight: 600; }
.btn-danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.link { background: none; border: 0; color: var(--action); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* Campos */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 600; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 11px; }
.input:focus { border-color: var(--action); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--action) 25%, transparent); }
.hint { font-size: .78rem; color: var(--muted); }

/* Evento */
.hero { background: var(--surface-2); color: var(--ink); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.hero .club { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--action); font-weight: 700; }
.hero h1 { font-size: 2.3rem; }
.hero .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.hero .facts div { display: flex; flex-direction: column; }
.hero .facts span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hero .facts strong { font-weight: 600; }
.dist { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.dist:first-of-type { border-top: 0; padding-top: 0; }
.dist .km { font-family: var(--display); font-size: 1.6rem; font-weight: 800; line-height: 1; }
.dist .price { text-align: right; font-weight: 700; font-size: 1.05rem; }
.dist .socio { text-align: right; font-size: .8rem; color: var(--ok); font-weight: 600; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--action); }
.sticky-cta { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }

/* Escolha de distância */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; min-width: 92px; }
.chip b { font-family: var(--display); font-size: 1.25rem; line-height: 1; }
.chip span { font-size: .78rem; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--action); background: color-mix(in srgb, var(--action) 10%, var(--surface)); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
.pill-ok { background: var(--ok-bg); color: var(--ok); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.part-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.part-head h3 { display: flex; align-items: center; gap: 8px; }
.part-num { background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 800; border-radius: 6px; padding: 0 7px; }
.errors { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: .88rem; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.summary-line { display: flex; justify-content: space-between; gap: 8px; font-size: .92rem; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 10px; }
.total strong { font-family: var(--display); font-size: 1.9rem; font-weight: 800; }

/* Pix */
.qr { width: 220px; height: 220px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 10px; border: 1px solid var(--line); }
.qr canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.copy { display: flex; gap: 8px; }
.copy input { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: .8rem; }
.waiting { display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.pay-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay-tabs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; }
.pay-tabs button[aria-pressed="true"] { border-color: var(--action); }
.pay-tabs button:disabled { opacity: .55; cursor: not-allowed; }

/* Número de peito (confirmação) */
.bib { background: var(--bib); color: var(--bib-ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; position: relative; }
.bib::before, .bib::after { content: ""; position: absolute; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); }
.bib::before { left: 8px; } .bib::after { right: 8px; }
.bib .n { grid-row: span 2; font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; padding-left: 8px; }
.bib .who { font-weight: 700; }
.bib .what { font-size: .85rem; }
.success { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-block: 6px; }
.check { width: 54px; height: 54px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; font-size: 1.8rem; font-weight: 800; }

/* Minhas inscrições */
.reg { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.date-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; text-align: center; font-family: var(--display); line-height: 1; }
.date-box b { display: block; font-size: 1.6rem; font-weight: 800; }
.date-box span { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }

/* Organizador */
.org-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.org-nav button { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.org-nav button[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.crumb { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.ev-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.ev-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.ev-tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--action); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile strong { display: block; font-family: var(--display); font-size: 2rem; font-weight: 800; line-height: 1.1; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.hbar { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; font-size: .88rem; }
.hbar .track { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--action); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters .input { width: auto; padding: 8px 10px; }
.filters .search { flex: 1; min-width: 180px; }
.ev-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
@media (max-width: 560px) { .ev-card { grid-template-columns: auto 1fr; } .ev-card .ev-actions { grid-column: 1 / -1; } }
.dist-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
@media (max-width: 640px) { .dist-row { grid-template-columns: 1fr 1fr; } }
.toggle { display: flex; gap: 10px; align-items: flex-start; }
.toggle input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--action); }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-list label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.radio-list input { margin-top: 4px; accent-color: var(--action); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.code-boxes { display: flex; gap: 8px; }
.code-boxes input { width: 100%; text-align: center; font-family: var(--display); font-size: 1.6rem; font-weight: 700; letter-spacing: .3em; }
</style>

<div class="proto" role="navigation" aria-label="Navegação do protótipo">
  <span class="tag"><b>Protótipo</b>Inscrições</span>
  <div class="seg" role="group" aria-label="Ver como">
    <button type="button" id="mode-atleta" data-action="mode" data-mode="atleta">Atleta</button>
    <button type="button" id="mode-org" data-action="mode" data-mode="org">Organizador</button>
  </div>
  <label class="sr" for="screen-pick" hidden>Tela</label>
  <select id="screen-pick" aria-label="Ir para a tela"></select>
  <span class="spacer"></span>
  <button type="button" class="reset" data-action="reset">Recomeçar</button>
</div>

<main id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
// ---------- Dados de exemplo ----------
const EV = {
  clube: 'CF Assessoria Esportiva',
  nome: 'Simulado 10K',
  data: 'Dom, 13 dez 2026', hora: '5h30',
  local: 'Parque da Cidade (exemplo)',
  prazo: 'até 10/12', transf: 'até 06/12',
  kit: 'Camisa, medalha, água e fruta na chegada',
  dists: [
    { id: '5', nome: '5 km', preco: 50, socio: 40, vagas: 80, ocup: 52 },
    { id: '10', nome: '10 km', preco: 60, socio: 45, vagas: 100, ocup: 71 },
    { id: '21', nome: '21 km', preco: 80, socio: 65, vagas: 40, ocup: 18 }
  ],
  tamanhos: ['PP', 'P', 'M', 'G', 'GG', 'XG'],
  faixas: [[0, 17, 'Até 17'], [18, 29, '18–29'], [30, 39, '30–39'], [40, 49, '40–49'], [50, 59, '50–59'], [60, 120, '60+']]
};
const SOCIOS = { '11111111111': 'Marina Costa', '22222222222': 'Rafael Lima' };
const CUPONS = { 'AMIGO10': { tipo: 'pct', valor: 10, desc: '10% de desconto' }, 'PARCEIRO': { tipo: 'val', valor: 10, desc: 'R$ 10 de desconto' } };
const CONTA = { nome: 'Marina Costa', cpf: '111.111.111-11', email: 'marina@exemplo.com', nasc: '1988-04-12', sexo: 'F', tel: '(00) 98888-1234', camisa: 'M', emerg: 'Paulo Costa · (00) 97777-0000' };

const SCREENS = {
  atleta: [
    ['evento', 'Página do evento'], ['entrar', 'Entrar com código'], ['participantes', 'Dados e participantes'],
    ['pix', 'Pagamento Pix'], ['confirmado', 'Inscrição confirmada'], ['minhas', 'Minhas inscrições'], ['transferir', 'Transferir inscrição']
  ],
  org: [
    ['org-eventos', 'Meus eventos'], ['org-inscritos', 'Evento › Inscritos'], ['org-editar', 'Evento › Editar'],
    ['org-cupons', 'Evento › Cupons'], ['org-novo', 'Novo evento'], ['org-socios', 'Sócios (CPFs)'], ['org-pagamento', 'Mercado Pago']
  ]
};

const NOMES = ['Ana Beatriz Souza', 'Bruno Carvalho', 'Camila Rocha', 'Diego Martins', 'Elaine Pereira', 'Fábio Nunes', 'Gabriela Alves', 'Henrique Dias', 'Isabela Freitas', 'João Pedro Lima', 'Karina Melo', 'Lucas Barbosa', 'Mariana Teixeira', 'Nathan Cardoso', 'Otávio Ramos', 'Patrícia Gomes', 'Renata Moura', 'Sérgio Araújo', 'Tatiane Ribeiro', 'Vinícius Castro', 'Wesley Pinto', 'Yasmin Correia', 'Rafael Lima', 'Marina Costa'];

function seedInscritos() {
  const d = ['10', '5', '10', '21', '5', '10', '10', '5', '21', '10', '5', '10', '21', '10', '5', '10', '5', '10', '21', '10', '5', '10', '10', '10'];
  const cam = ['M', 'P', 'G', 'M', 'PP', 'GG', 'M', 'P', 'G', 'M', 'P', 'M', 'G', 'GG', 'P', 'M', 'M', 'G', 'P', 'XG', 'G', 'P', 'G', 'M'];
  const sx = ['F', 'M', 'F', 'M', 'F', 'M', 'F', 'M', 'F', 'M', 'F', 'M', 'F', 'M', 'M', 'F', 'F', 'M', 'F', 'M', 'M', 'F', 'M', 'F'];
  const ida = ['30–39', '40–49', '18–29', '30–39', '50–59', '40–49', '30–39', '18–29', '40–49', '30–39', '30–39', '50–59', '30–39', '18–29', '60+', '40–49', '30–39', '40–49', '18–29', '30–39', '50–59', '18–29', '40–49', '30–39'];
  return NOMES.map((n, i) => {
    const dist = EV.dists.find(x => x.id === d[i]);
    const socio = i % 3 === 0 || n === 'Marina Costa' || n === 'Rafael Lima';
    const status = i === 4 || i === 15 ? 'pendente' : (i === 9 ? 'cancelada' : 'paga');
    return { n: 101 + i, nome: n, dist: d[i], cat: (sx[i] === 'F' ? 'Fem ' : 'Masc ') + ida[i], camisa: cam[i], valor: socio ? dist.socio : dist.preco, socio, status, transf: i === 7 ? 'de Paulo Souza' : '' };
  });
}

function freshState() {
  return {
    logged: false, email: '', codeSent: false, code: '',
    parts: [], cupom: null, cupomTxt: '', cupomMsg: '', aceite: false, errors: [],
    pedido: null, pay: 'pix',
    minhas: [],
    transferIdx: 0, transferDone: false,
    org: {
      inscritos: seedInscritos(), fDist: '', fStatus: '', busca: '', cancelConfirm: null,
      socios: Object.entries(SOCIOS).map(([cpf, nome]) => ({ cpf, nome })).concat([{ cpf: '33333333333', nome: 'Diego Martins' }, { cpf: '44444444444', nome: 'Camila Rocha' }]),
      sociosTxt: '', cupons: [{ cod: 'AMIGO10', desc: '10% de desconto', usos: 3, max: 20 }, { cod: 'PARCEIRO', desc: 'R$ 10 de desconto', usos: 1, max: 10 }],
      distEdit: EV.dists.map(d => ({ ...d })), distNovo: [{ id: 'n1', nome: '', preco: 0, socio: 0, vagas: 0 }], camisa: true, faixa: true, mp: true, taxa: 'clube'
    }
  };
}
let S = freshState();
let timer = null;

// ---------- Utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const digits = s => (s || '').replace(/\D/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtCpf(v) { const d = digits(v).slice(0, 11); return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2'); }
function fmtCpfDigits(d) { return fmtCpf(d); }
function idade(nasc) { if (!nasc) return null; const b = new Date(nasc + 'T12:00:00'), ev = new Date('2026-12-13T12:00:00'); let a = ev.getFullYear() - b.getFullYear(); if (ev < new Date(ev.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function categoria(p) { const a = idade(p.nasc); if (a == null || !p.sexo) return null; const f = EV.faixas.find(([lo, hi]) => a >= lo && a <= hi); return (p.sexo === 'F' ? 'Feminino ' : 'Masculino ') + (f ? f[2] : ''); }
function precoDe(p) { const d = EV.dists.find(x => x.id === p.dist); if (!d) return 0; return SOCIOS[digits(p.cpf)] ? d.socio : d.preco; }
function totais() {
  const sub = S.parts.reduce((s, p) => s + precoDe(p), 0);
  let desc = 0;
  if (S.cupom) desc = S.cupom.tipo === 'pct' ? sub * S.cupom.valor / 100 : Math.min(S.cupom.valor, sub);
  return { sub, desc, total: sub - desc };
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
function go(screen) { if (location.hash.slice(1) === screen) render(); else location.hash = screen; }

function fakeQr(canvas, seed) {
  const n = 29, ctx = canvas.getContext('2d'); canvas.width = n; canvas.height = n;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, n, n); ctx.fillStyle = '#000';
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (rnd() > .52) ctx.fillRect(x, y, 1, 1);
  const finder = (x, y) => { ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 9, 9); ctx.fillStyle = '#000'; ctx.fillRect(x, y, 7, 7); ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 1, 5, 5); ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 3, 3); };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
}

// ---------- Render ----------
const RENDER = { evento: scrEvento, entrar: scrEntrar, participantes: scrParticipantes, pix: scrPix, confirmado: scrConfirmado, minhas: scrMinhas, transferir: scrTransferir, 'org-eventos': scrOrgEventos, 'org-inscritos': scrOrgInscritos, 'org-editar': scrOrgEditar, 'org-novo': scrOrgNovo, 'org-cupons': scrOrgCupons, 'org-socios': scrOrgSocios, 'org-pagamento': scrOrgPagamento };

function current() { const h = location.hash.slice(1); return RENDER[h] ? h : 'evento'; }
function render() {
  const scr = current();
  clearInterval(timer);
  const mode = scr.startsWith('org-') ? 'org' : 'atleta';
  $('#mode-atleta').setAttribute('aria-pressed', mode === 'atleta');
  $('#mode-org').setAttribute('aria-pressed', mode === 'org');
  $('#screen-pick').innerHTML = SCREENS[mode].map(([k, l]) => `<option value="${k}" ${k === scr ? 'selected' : ''}>${l}</option>`).join('');
  $('#app').innerHTML = RENDER[scr]();
  if (scr === 'pix') {
    fakeQr($('#qr'), 7 + Math.round(S.pedido.total));
    timer = setInterval(() => { if (S.pedido.secs > 0) S.pedido.secs--; const el = $('#countdown'); if (el) el.textContent = String(Math.floor(S.pedido.secs / 60)).padStart(2, '0') + ':' + String(S.pedido.secs % 60).padStart(2, '0'); }, 1000);
  }
}

function refreshPart(i) {
  const p = S.parts[i]; if (!p) return;
  const socio = SOCIOS[digits(p.cpf)];
  const dup = digits(p.cpf).length === 11 && S.parts.some((q, j) => j !== i && digits(q.cpf) === digits(p.cpf));
  const info = $('#cpf-info-' + i); if (info) info.innerHTML = (socio ? `<span class="pill pill-ok">Sócio do clube · preço de sócio</span>` : '') + (dup ? `<span class="pill pill-bad">CPF repetido neste pedido</span>` : '');
  const card = $(`[data-part="${i}"]`);
  if (card) card.querySelectorAll('.chip').forEach(c => { const d = EV.dists.find(x => x.id === c.dataset.d); c.querySelector('span').textContent = brl(socio ? d.socio : d.preco); });
  const cat = $('#cat-' + i); if (cat) { const c = categoria(p); cat.innerHTML = c ? `Categoria: <b>${c}</b>` : '<span class="muted">A categoria aparece depois de nascimento e sexo.</span>'; }
  const sm = $('#summary'); if (sm) sm.innerHTML = summaryHtml();
  const cta = $('[data-action="checkout"]'); if (cta) cta.textContent = 'Pagar ' + brl(totais().total) + ' com Pix';
}

function validate() {
  const e = [];
  S.parts.forEach((p, i) => {
    const who = i === 0 ? 'Você' : 'Participante ' + (i + 1);
    const miss = [];
    if (!p.dist) miss.push('distância');
    if (digits(p.cpf).length !== 11) miss.push('CPF');
    if (!p.nome.trim()) miss.push('nome');
    if (!p.nasc) miss.push('nascimento');
    if (!p.sexo) miss.push('sexo');
    if (!p.camisa) miss.push('camisa');
    if (miss.length) e.push(`${who}: ${miss.join(', ')}`);
  });
  const cpfs = S.parts.map(p => digits(p.cpf)).filter(c => c.length === 11);
  if (new Set(cpfs).size !== cpfs.length) e.push('Há CPF repetido no pedido.');
  if (!S.aceite) e.push('Aceite o regulamento.');
  return e;
}

// ---------- Eventos ----------
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, i = +b.dataset.i;
  switch (a) {
    case 'mode': go(b.dataset.mode === 'org' ? 'org-eventos' : 'evento'); break;
    case 'reset': S = freshState(); go('evento'); toast('Protótipo reiniciado'); break;
    case 'goto': go(b.dataset.to); break;
    case 'toast': toast(b.dataset.msg); break;
    case 'start': if (!S.parts.length) S.parts = [emptyPart()]; S.codeSent = false; go(S.logged ? 'participantes' : 'participantes'); break;
    case 'send-code': if (!/\S+@\S+\.\S+/.test(S.email)) { toast('Digite um e-mail válido'); return; } S.codeSent = true; render(); toast('Código enviado para ' + S.email); break;
    case 'change-email': S.codeSent = false; S.code = ''; render(); break;
    case 'verify': {
      if (digits(S.code).length !== 6) { toast('O código tem 6 dígitos'); return; }
      S.logged = true;
      const returning = S.email.toLowerCase() === CONTA.email;
      if (!S.parts.length) S.parts = [emptyPart()];
      if (returning) { const d = S.parts[0].dist; S.parts[0] = { ...CONTA, dist: d }; }
      else S.parts[0].email = S.email;
      if (current() !== 'participantes') go('participantes'); else render();
      toast(returning ? 'Bem-vinda de volta! Seus dados foram preenchidos.' : 'Conta criada. Complete seus dados.');
      break;
    }
    case 'dist': S.parts[i].dist = b.dataset.d; b.closest('.chips').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); refreshPart(i); break;
    case 'add-part': S.parts.push(emptyPart()); render(); setTimeout(() => { const el = $(`[data-part="${S.parts.length - 1}"]`); el && el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); break;
    case 'remove-part': S.parts.splice(i, 1); render(); break;
    case 'cupom': {
      const c = CUPONS[(S.cupomTxt || '').trim().toUpperCase()];
      if (c) { S.cupom = { ...c, cod: S.cupomTxt.trim().toUpperCase() }; S.cupomMsg = 'Cupom aplicado: ' + c.desc + '.'; }
      else { S.cupom = null; S.cupomMsg = 'Cupom não encontrado ou esgotado.'; }
      render(); break;
    }
    case 'checkout': {
      S.errors = validate();
      if (S.errors.length) { render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      S.pedido = { id: 'A' + Math.floor(1000 + Math.random() * 9000), total: totais().total, status: 'pendente', secs: 30 * 60, parts: S.parts.map(p => ({ ...p })) };
      go('pix'); break;
    }
    case 'copy': { const inp = $('#pix-code'); const done = () => toast('Código Pix copiado'); if (navigator.clipboard) navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); toast('Selecionado: use Copiar do celular'); }); else { inp.select(); toast('Selecionado: use Copiar do celular'); } break; }
    case 'copy-link': { const link = 'seusite.vercel.app/eventos/simulado-10k-dezembro'; const done = () => toast('Link copiado: ' + link); if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => toast(link)); else toast(link); break; }
    case 'simulate-paid': go('confirmado'); break;
    case 'transfer': S.transferIdx = i; S.transferDone = false; go('transferir'); break;
    case 'do-transfer': {
      const nome = $('#t-nome').value.trim();
      if (digits($('#t-cpf').value).length !== 11 || !nome) { toast('Preencha CPF e nome do novo participante'); return; }
      const m = S.minhas[S.transferIdx]; m.transf = m.nome; m.nome = nome; S.transferDone = true; render(); break;
    }
    case 'org-cancel': S.org.cancelConfirm = +b.dataset.n; render(); break;
    case 'org-cancel-no': S.org.cancelConfirm = null; render(); break;
    case 'org-cancel-yes': { const x = S.org.inscritos.find(y => y.n === +b.dataset.n); x.status = 'cancelada'; S.org.cancelConfirm = null; render(); toast('Inscrição ' + x.n + ' cancelada. A vaga voltou a ficar disponível.'); break; }
    case 'de-add': (b.dataset.novo === 'true' ? S.org.distNovo : S.org.distEdit).push({ id: 'n' + Date.now(), nome: '', preco: 0, socio: 0, vagas: 0 }); render(); break;
    case 'de-remove': (b.dataset.novo === 'true' ? S.org.distNovo : S.org.distEdit).splice(i, 1); render(); break;
    case 'add-cupom': { const cod = $('#cp-cod').value.trim().toUpperCase(); if (!cod) { toast('Digite um código'); return; } S.org.cupons.push({ cod, desc: $('#cp-desc').value + ' de desconto', usos: 0, max: +$('#cp-max').value || 0 }); render(); toast('Cupom ' + cod + ' criado'); break; }
    case 'import-socios': {
      const lines = $('#soc-txt').value.split('\n').map(l => l.trim()).filter(Boolean); let n = 0;
      lines.forEach(l => { const [c, ...rest] = l.split(/[;,\t]/); const cpf = digits(c); if (cpf.length === 11 && !S.org.socios.some(s => s.cpf === cpf)) { S.org.socios.push({ cpf, nome: rest.join(' ').trim() || '—' }); n++; } });
      S.org.sociosTxt = ''; render(); toast(n + ' sócio(s) importado(s)'); break;
    }
    case 'mp-toggle': S.org.mp = !S.org.mp; render(); toast(S.org.mp ? 'Mercado Pago conectado' : 'Conta desconectada'); break;
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.mask === 'cpf') { t.value = fmtCpf(t.value); }
  const k = t.dataset.bind; if (!k) return;
  const val = t.type === 'checkbox' ? t.checked : t.value;
  if (t.dataset.i !== undefined && S.parts[+t.dataset.i]) { S.parts[+t.dataset.i][k] = val; refreshPart(+t.dataset.i); return; }
  if (k === 'org-busca') { S.org.busca = val; const pos = t.selectionStart; render(); const nb = $('#org-busca'); nb.focus(); nb.setSelectionRange(pos, pos); return; }
  if (k === 'org-fdist') { S.org.fDist = val; render(); return; }
  if (k === 'org-fstatus') { S.org.fStatus = val; render(); return; }
  if (k === 'org-taxa') { S.org.taxa = val; return; }
  S[k] = val;
});
document.addEventListener('change', ev => { const t = ev.target; if (t.dataset.bind && t.tagName === 'SELECT' && t.dataset.i !== undefined) { S.parts[+t.dataset.i][t.dataset.bind] = t.value; refreshPart(+t.dataset.i); } });
$('#screen-pick').addEventListener('change', e => go(e.target.value));
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>

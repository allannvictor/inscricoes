name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inscricoes
          POSTGRES_PASSWORD: inscricoes
          POSTGRES_DB: inscricoes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inscricoes" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://inscricoes:inscricoes@localhost:5432/inscricoes
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Os testes de ponta a ponta rodam na versão compilada (next start), como na homologação.
      - run: npm run test:e2e -- --trace off
        env:
          CI: '1'
